[package]
name = "lumux"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Like tmux, but with native Windows support — a lightweight, open-source, tmux-config-compatible multiplexer that runs cross-platform on Windows, Linux, and macOS."
keywords = ["tmux", "multiplexer", "windows", "cross-platform", "lightweight"]
categories = ["command-line-utilities"]

[[bin]]
name = "lumux"
path = "src/main.rs"

[dependencies]
lumux-core = { workspace = true }
lumux-server = { workspace = true }
clap = { workspace = true }
toml = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
anyhow = { workspace = true }

[target.'cfg(unix)'.dependencies]
lumux-backend-unix = { workspace = true }
libc = "0.2"

[target.'cfg(windows)'.dependencies]
lumux-backend-win = { workspace = true }
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_System_Console",
    "Win32_System_Threading",
] }
