[package]
name = "lumux"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "A tmux-like terminal multiplexer for the Windows host, attachable as plain text over SSH."
keywords = ["tmux", "terminal", "multiplexer", "windows", "conpty"]
categories = ["command-line-utilities"]

[[bin]]
name = "lumux"
path = "src/main.rs"

[dependencies]
lumux-core = { workspace = true }
lumux-server = { workspace = true }
clap = { workspace = true }
toml = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
anyhow = { workspace = true }

[target.'cfg(unix)'.dependencies]
lumux-backend-unix = { workspace = true }
libc = "0.2"

[target.'cfg(windows)'.dependencies]
lumux-backend-win = { workspace = true }
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_System_Console",
    "Win32_System_Threading",
] }
