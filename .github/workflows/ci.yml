name: ci

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  linux:
    name: linux (unit tests, unix backend)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: build
        run: cargo build --workspace
      - name: test core
        run: cargo test -p wmux-core
      - name: test workspace
        run: cargo test --workspace

  windows:
    name: windows (build + integration, win backend)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: build
        run: cargo build --workspace
      # Phase 10+ enables the ConPTY / named-pipe integration tests here.
      - name: test core
        run: cargo test -p wmux-core
