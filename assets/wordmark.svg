<svg xmlns="http://www.w3.org/2000/svg" width="640" height="160" viewBox="0 0 640 160" role="img" aria-label="lumux">
  <title>lumux</title>

  <!-- icon, scaled into a 128-box at left -->
  <g transform="translate(16,16) scale(0.5)">
    <rect x="20" y="20" width="216" height="216" rx="48" fill="#141821" stroke="#262d39" stroke-width="2.5"/>
    <rect x="48" y="48" width="56" height="98" rx="10" fill="#ee7e4a"/>
    <rect x="118" y="48" width="90" height="98" rx="10" fill="#202833"/>
    <rect x="150" y="80" width="24" height="36" rx="4" fill="#5b9ec2"/>
    <rect x="48" y="160" width="160" height="48" rx="10" fill="#ee7e4a"/>
  </g>

  <!-- wordmark: "lu" lit light-Rust orange, "mux" ink. Monospace stack with generic fallback. -->
  <text x="156" y="104"
        font-family="ui-monospace, 'SF Mono', 'Cascadia Code', 'JetBrains Mono', Menlo, Consolas, monospace"
        font-size="84" font-weight="700" letter-spacing="-2">
    <tspan fill="#ee7e4a">lu</tspan><tspan fill="#e6edf3">mux</tspan>
  </text>
</svg>
