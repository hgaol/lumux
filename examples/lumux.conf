# lumux configuration in tmux syntax.
#
# Copy your ~/.tmux.conf to ~/.lumux.conf (or %APPDATA%\lumux\lumux.conf on
# Windows) and it just works: lumux reads the directives it supports and ignores
# the rest with a warning. This file shows the supported subset.
#
# Format is chosen by extension — a .conf (or any non-.toml) file is parsed as
# tmux syntax; a .toml file as native TOML (see examples/config.toml).
# Reload live with `lumux source-file <path>` or prefix + r.

# --- Prefix -----------------------------------------------------------------
set -g prefix C-b            # Ctrl-b (the default). Press it twice for a literal.

# --- Behavior ---------------------------------------------------------------
set -g mouse on              # click to select, wheel to scroll, drag to resize
set -g history-limit 10000   # scrollback lines per pane
set -g base-index 1          # number windows/panes from 1
setw -g pane-base-index 1

# --- Default shell ----------------------------------------------------------
# On Windows you'll usually want PowerShell or cmd. Either form works:
set -g default-shell powershell.exe
# set -g default-command "powershell.exe -NoLogo"

# --- Status bar -------------------------------------------------------------
set -g status-justify centre
set -g status-style bg=colour24,fg=white
set -g status-left "#[fg=white,bg=colour124,bold] REMOTE #[bg=colour24,fg=green] Session: #S "
set -g status-right "#[fg=cyan]%H:%M #[fg=yellow]%d-%b-%y"

# --- Key bindings (after the prefix) ----------------------------------------
bind | split-window -h       # side-by-side
bind - split-window -v       # top/bottom
bind r source-file ~/.lumux.conf \; display "reloaded"
bind z resize-pane -Z        # zoom toggle

# --- Root bindings (no prefix; tmux bind -n) --------------------------------
bind -n M-Left  select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up    select-pane -U
bind -n M-Down  select-pane -D

# --- Copy mode --------------------------------------------------------------
# lumux copy-mode already supports vi keys (h/j/k/l move, v select, y yank) and
# u/d half-page scroll, so `setw -g mode-keys vi` is accepted but not required.
setw -g mode-keys vi
